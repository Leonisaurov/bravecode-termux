name: Build libopentui.so (Android ARM64)

# Compila la librería nativa de OpenTUI que necesita el port de BraveCode en
# Termux/Android: @opentui/core no publica binarios Android, y los de Linux
# (glibc) no los puede cargar el linker de Bionic.
#
# Receta portada del pipeline validado en ../opencode-termux
# (opentui/scripts/build-opentui.sh): Zig + NDK Bionic descrito por
# ci/build-opentui-android.sh a través de un `--libc` (android-libc.txt).
# La librería resultante se verifica con ci/verify-libopentui.sh, que exige
# ELF AArch64, NEEDED libc.so y los 397 símbolos FFI de @opentui/core 0.5.9.

on:
  workflow_dispatch:
    inputs:
      opentui_ref:
        description: "Ref de OpenTUI a compilar (tag/commit)"
        required: false
        default: "v0.5.9"
      optimize:
        description: "Modo de optimización de Zig"
        required: false
        default: "ReleaseSafe"
  push:
    branches: [main]
    paths:
      - "ci/**"
      - ".github/workflows/build-opentui-android.yml"

permissions:
  contents: read

env:
  ZIG_VERSION: "0.16.0"
  ANDROID_API: "24"
  OPENTUI_TARGET: aarch64-linux-android.24
  OPENTUI_REF: ${{ inputs.opentui_ref || 'v0.5.9' }}
  OPENTUI_OPTIMIZE: ${{ inputs.optimize || 'ReleaseSafe' }}

jobs:
  build-opentui:
    name: Build libopentui.so (Android ARM64)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Cache OpenTUI source + Zig caches
        uses: actions/cache@v4
        with:
          path: |
            build/opentui-src
            build/cache
          key: opentui-${{ env.OPENTUI_REF }}-${{ hashFiles('ci/build-opentui-android.sh', 'ci/verify-libopentui.sh', 'ci/required-symbols.txt') }}
          restore-keys: |
            opentui-${{ env.OPENTUI_REF }}-

      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/zig.tar.xz" \
            "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
          mkdir -p build/zig
          tar -xJf "$RUNNER_TEMP/zig.tar.xz" -C build/zig --strip-components=1
          build/zig/zig version

      - name: Install Android NDK r28b
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/ndk.zip" \
            "https://dl.google.com/android/repository/android-ndk-r28b-linux.zip"
          unzip -q "$RUNNER_TEMP/ndk.zip" -d build
          mv build/android-ndk-r28b build/android-ndk
          ls build/android-ndk/toolchains/llvm/prebuilt

      - name: Build libopentui.so (Android aarch64)
        env:
          ZIG_BIN: ${{ github.workspace }}/build/zig/zig
          ANDROID_NDK_HOME: ${{ github.workspace }}/build/android-ndk
        run: bash ci/build-opentui-android.sh

      - name: Verify native library
        run: bash ci/verify-libopentui.sh native/libopentui.android-arm64.so

      - name: Checksums and summary
        run: |
          set -euo pipefail
          sha256sum native/libopentui.android-arm64.so | tee native/SHA256SUMS
          file native/libopentui.android-arm64.so
          readelf -d native/libopentui.android-arm64.so | grep -E "NEEDED|SONAME"
          {
            echo "### libopentui.so (Android aarch64) listo"
            echo
            echo "- OpenTUI ref: \`${OPENTUI_REF}\`"
            echo "- target Zig: \`${OPENTUI_TARGET}\` (NDK r28b, API ${ANDROID_API})"
            echo "- optimización: \`${OPENTUI_OPTIMIZE}\`"
            echo "- tamaño: $(du -h native/libopentui.android-arm64.so | cut -f1)"
            echo
            echo '```'
            sha256sum native/libopentui.android-arm64.so
            readelf -d native/libopentui.android-arm64.so | grep -E "NEEDED|SONAME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload libopentui.so
        uses: actions/upload-artifact@v4
        with:
          name: libopentui-android-arm64
          path: |
            native/libopentui.android-arm64.so
            native/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
